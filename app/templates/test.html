<body>
<div class="header">
  <h1>PhotoCompressorService<span class="version">v{{ version }}</span></h1>
  <a class="gh-link" href="{{ github_url }}" target="_blank" rel="noopener">Проєкт на GitHub — вихідний код, документація, релізи ↗</a>
</div>
<p class="tagline">Стиснення та конвертація фото для 1С. Нижче — живий приклад роботи й інструмент для перевірки.</p>

<div class="update-banner" id="update-banner">
  <span id="update-text"></span>
  <button id="update-btn">Завантажити оновлення</button>
</div>

<p>Перевірка на власному фото — ті самі параметри, що приймає <code>POST /compress</code>:</p>

<div class="layout">
  <div class="panel params">
    <label>Файл зображення
      <input type="file" id="file" accept="image/*">
    </label>
    <label>Макс. ширина (px)
      <input type="number" id="max_width" value="{{ defaults.max_width }}">
    </label>
    <label>Макс. висота (px)
      <input type="number" id="max_height" value="{{ defaults.max_height }}">
    </label>
    <label>Макс. розмір (КБ)
      <input type="number" id="max_size_kb" value="{{ defaults.max_size_kb }}">
    </label>
    <label>Початкова якість JPEG
      <input type="number" id="quality_start" value="{{ defaults.quality_start }}">
    </label>
    <label>Мінімальна якість JPEG
      <input type="number" id="quality_min" value="{{ defaults.quality_min }}">
    </label>
    <label>Крок зниження якості
      <input type="number" id="quality_step" value="{{ defaults.quality_step }}">
    </label>
    <button id="run" disabled>Стиснути</button>
    <button id="gen-code" class="btn-secondary">Згенерувати код 1С</button>
    <div class="error" id="error"></div>
  </div>

  <div class="panel results">
    <div class="compare">
      <figure>
        <img id="preview-before" alt="до" src="data:image/jpeg;base64,{{ demo.before_b64 }}">
        <figcaption>До</figcaption>
        <div class="stats" id="stats-before">{{ demo.before_dims }} · {{ demo.before_kb }} КБ</div>
      </figure>
      <figure>
        <img id="preview-after" alt="після" src="data:image/jpeg;base64,{{ demo.after_b64 }}">
        <figcaption>Після <span class="badge example" id="badge">приклад</span></figcaption>
        <div class="stats" id="stats-after">{{ demo.after_dims }} · {{ demo.after_kb }} КБ{% if demo.quality_used %} · якість {{ demo.quality_used }}{% endif %}</div>
      </figure>
    </div>
  </div>
</div>

<div class="panel code-panel" id="code-panel" hidden>
  <div class="head">
    <strong>Готовий код BSL для 1С</strong>
    <button class="copy-btn" id="copy-code">Скопіювати</button>
  </div>
  <pre id="code-output"></pre>
</div>

<script>
const fileInput = document.getElementById('file');
const runBtn = document.getElementById('run');
const errorBox = document.getElementById('error');

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

fileInput.addEventListener('change', () => {
  runBtn.disabled = !fileInput.files.length;
  errorBox.textContent = '';
  if (fileInput.files.length) {
    const file = fileInput.files[0];
    document.getElementById('preview-before').src = URL.createObjectURL(file);
    document.getElementById('stats-before').textContent =
      `${file.name} · ${(file.size / 1024).toFixed(1)} КБ`;
  }
});

runBtn.addEventListener('click', async () => {
  errorBox.textContent = '';
  runBtn.disabled = true;
  runBtn.textContent = 'Обробка...';
  try {
    const file = fileInput.files[0];
    const base64 = await fileToBase64(file);
    const payload = {
      image_base64: base64,
      max_width: Number(document.getElementById('max_width').value),
      max_height: Number(document.getElementById('max_height').value),
      max_size_kb: Number(document.getElementById('max_size_kb').value),
      quality_start: Number(document.getElementById('quality_start').value),
      quality_min: Number(document.getElementById('quality_min').value),
      quality_step: Number(document.getElementById('quality_step').value),
    };
    const resp = await fetch('/compress', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await resp.json();
    if (!resp.ok || !data.success) {
      throw new Error(data.error || `HTTP ${resp.status}`);
    }
    document.getElementById('preview-after').src = 'data:image/jpeg;base64,' + data.image_base64;
    document.getElementById('stats-after').textContent =
      `${data.format} ${data.width}x${data.height} · ${data.size_kb} КБ` +
      (data.quality_used ? ` · якість ${data.quality_used}` : '');
    const badge = document.getElementById('badge');
    badge.textContent = data.changed ? 'змінено' : 'без змін';
    badge.className = 'badge ' + (data.changed ? 'changed' : 'unchanged');
  } catch (err) {
    errorBox.textContent = 'Помилка: ' + err.message;
  } finally {
    runBtn.disabled = false;
    runBtn.textContent = 'Стиснути';
  }
});

function buildBslCode() {
  const host = window.location.hostname;
  const port = window.location.port || '80';
  const p = {
    maxWidth: document.getElementById('max_width').value,
    maxHeight: document.getElementById('max_height').value,
    maxSizeKb: document.getElementById('max_size_kb').value,
    qualityStart: document.getElementById('quality_start').value,
    qualityMin: document.getElementById('quality_min').value,
    qualityStep: document.getElementById('quality_step').value,
  };
  return `// Отправляет изображение на локальный Python-сервис (${host}:${port}) для сжатия
// и конвертации в JPEG (сервис всегда возвращает JPEG, независимо от исходного формата).
// Если сервис недоступен или вернул ошибку - возвращает исходные данные БЕЗ ИЗМЕНЕНИЙ
// (Успех = Ложь) - в этом случае расширение файла менять не нужно, формат остался прежним.
//
// Параметры:
//  ДвоичныеДанные - ДвоичныеДанные - исходное изображение
//  МаксШирина     - Число - максимальная ширина в пикселях (по умолчанию ${p.maxWidth})
//  МаксВысота     - Число - максимальная высота в пикселях (по умолчанию ${p.maxHeight})
//  МаксРазмерКБ   - Число - целевой максимальный размер файла в килобайтах (по умолчанию ${p.maxSizeKb})
//
// Возвращаемое значение:
//  Структура:
//   * ДвоичныеДанные - ДвоичныеДанные - результат сжатия (JPEG) при Успех = Истина,
//                       либо исходные данные без изменений (в исходном формате) при Успех = Ложь
//   * Успех           - Булево - Истина, если сервис успешно обработал изображение и
//                       вернул его в JPEG - в этом случае нужно поменять расширение файла;
//                       Ложь - формат не менялся, расширение трогать не нужно
//
// ВАЖНО при интеграции со стандартной подсистемой "Файлы" (бд_ДобавитьФайл и т.п.):
// одной подмены переменной ДвоичныеДанные НЕДОСТАТОЧНО, если дальше по коду менеджер
// файлов берёт содержимое из АдресФайлаВоВременномХранилище, а не из этой переменной.
// Обязательно обновите и адрес во временном хранилище тем же вызовом:
//   АдресФайлаВоВременномХранилище = ПоместитьВоВременноеХранилище(ДвоичныеДанные, АдресФайлаВоВременномХранилище);
// Иначе физически будет сохранён исходный файл, несмотря на "успешное" сжатие.
//
// Пример использования:
//  СтруктураОтвета = СжатьФото(ДвоичныеДанные);
//  Если СтруктураОтвета.Успех Тогда
//  	ДвоичныеДанные = СтруктураОтвета.ДвоичныеДанные;
//  	АдресФайлаВоВременномХранилище = ПоместитьВоВременноеХранилище(ДвоичныеДанные, АдресФайлаВоВременномХранилище);
//  	Если РасширениеБезТочки = "webp" Тогда
//  		РасширениеБезТочки = "jpg";
//  	КонецЕсли;
//  КонецЕсли;
//
Функция СжатьФото(ДвоичныеДанные, МаксШирина = ${p.maxWidth}, МаксВысота = ${p.maxHeight}, МаксРазмерКБ = ${p.maxSizeKb}) Экспорт

	СтруктураОтвета = Новый Структура;
	СтруктураОтвета.Вставить("ДвоичныеДанные", ДвоичныеДанные);
	СтруктураОтвета.Вставить("Успех", Ложь);

	Попытка
		Соединение = Новый HTTPСоединение("${host}", ${port}, , , , 10);

		Тело = Новый Структура;
		Тело.Вставить("image_base64", Base64Строка(ДвоичныеДанные));
		Тело.Вставить("max_width", МаксШирина);
		Тело.Вставить("max_height", МаксВысота);
		Тело.Вставить("max_size_kb", МаксРазмерКБ);
		Тело.Вставить("quality_start", ${p.qualityStart});
		Тело.Вставить("quality_min", ${p.qualityMin});
		Тело.Вставить("quality_step", ${p.qualityStep});

		ЗаписьJSON = Новый ЗаписьJSON;
		ЗаписьJSON.УстановитьСтроку();
		ЗаписатьJSON(ЗаписьJSON, Тело);
		СтрокаТела = ЗаписьJSON.Закрыть();

		Заголовки = Новый Соответствие;
		Заголовки.Вставить("Content-Type", "application/json");

		Запрос = Новый HTTPЗапрос("/compress", Заголовки);
		Запрос.УстановитьТелоИзСтроки(СтрокаТела);

		Ответ = Соединение.ОтправитьДляОбработки(Запрос);

		Если Ответ.КодСостояния <> 200 Тогда
			Возврат СтруктураОтвета; // сервис вернул ошибку — оставляем оригинал
		КонецЕсли;

		ЧтениеJSON = Новый ЧтениеJSON;
		ЧтениеJSON.УстановитьСтроку(Ответ.ПолучитьТелоКакСтроку());
		Результат = ПрочитатьJSON(ЧтениеJSON, Ложь);
		ЧтениеJSON.Закрыть();

		Если Результат.Свойство("success") И Результат.success Тогда
			СтруктураОтвета.Вставить("ДвоичныеДанные", Base64Значение(Результат.image_base64));
			СтруктураОтвета.Вставить("Успех", Истина);
		КонецЕсли;

		Возврат СтруктураОтвета;

	Исключение
		// служба недоступна — не блокируем работу пользователя
		Возврат СтруктураОтвета;
	КонецПопытки;

КонецФункции`;
}

const codePanel = document.getElementById('code-panel');
const codeOutput = document.getElementById('code-output');
const copyBtn = document.getElementById('copy-code');

document.getElementById('gen-code').addEventListener('click', () => {
  codeOutput.textContent = buildBslCode();
  codePanel.hidden = false;
  codePanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
});

copyBtn.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(codeOutput.textContent);
    const original = copyBtn.textContent;
    copyBtn.textContent = 'Скопійовано!';
    setTimeout(() => { copyBtn.textContent = original; }, 1500);
  } catch (err) {
    errorBox.textContent = 'Не вдалося скопіювати: ' + err.message;
  }
});

(async function checkForUpdates() {
  try {
    const resp = await fetch('/update-check');
    const data = await resp.json();
    if (!data.enabled || !data.update_available) return;

    document.getElementById('update-text').textContent =
      `Доступне оновлення ${data.latest_version} (поточна ${data.current_version}) · ${data.asset_name} · ${data.asset_size_mb} МБ`;
    document.getElementById('update-banner').classList.add('show');
  } catch (err) {
    // тихо ігноруємо — перевірка оновлень не критична для роботи сторінки
  }
})();

document.getElementById('update-btn').addEventListener('click', () => {
  window.location.href = '/update-download';
});
</script>
